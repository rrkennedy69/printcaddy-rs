[package]
name = "printcaddy-core"
version = "0.1.0"
edition = "2021"
description = "Document model, meshes, and STL import/export for PrintCaddy"
license = "MIT"

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
