<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>PrintCaddy</title>
    <base data-trunk-public-url />
    <link data-trunk rel="rust" data-bin="printcaddy-app" data-cargo-features="" />
    <link data-trunk rel="copy-file" href=".nojekyll" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f3ec;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
    <script>
      // iPad Safari turns a pinch into a page zoom unless the gesture is cancelled.
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
        window.addEventListener(name, function (event) { event.preventDefault(); }, { passive: false });
      });
      window.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      document.addEventListener("touchmove", function (event) { event.preventDefault(); }, { passive: false });
    </script>
  </head>
  <body>
    <canvas id="printcaddy"></canvas>
  </body>
</html>
