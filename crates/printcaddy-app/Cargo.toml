[package]
name = "printcaddy-app"
version = "0.1.0"
edition = "2021"
description = "PrintCaddy browser app: egui interface and a WebGL2 viewport"
license = "MIT"

[dependencies]
printcaddy-core = { path = "../printcaddy-core" }
serde_json = "1"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_glow = "0.31"
glam = "0.29"
glow = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "FileList",
    "File",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Event",
    "EventTarget",
    "Storage",
    "Location",
    "Request",
    "RequestInit",
    "RequestCache",
    "Response",
    "Headers",
    "HtmlHeadElement",
] }
console_error_panic_hook = "0.1"
